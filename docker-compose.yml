services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e_certificat
      POSTGRES_USER: e_certificat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_certificat -d e_certificat"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgres://e_certificat:${POSTGRES_PASSWORD:-local-change-me}@db:5432/e_certificat
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data: